# AI-SaMD Clinical Protocol Copilot — full stack for a single NVIDIA DGX Spark (GB10, aarch64, 128 GB).
#
#   cp .env.example .env            # edit LLM_MODEL etc.
#   docker compose --profile ollama up -d --build
#   docker compose --profile ollama run --rm ollama-pull        # first time: pull qwen3:32b + bge-m3
#   docker compose --profile ollama --profile ingest run --rm rag-ingest   # index TFDA/FDA/IMDRF guidance
#
# Profiles:
#   ollama  → Ollama serves BOTH the chat model (LLM_MODEL) and the embedding model (bge-m3)
#   vllm    → vLLM (NVIDIA container) serves the chat model; Ollama still serves embeddings only
#   ingest  → one-shot corpus ingestion job
#
# All images are multi-arch (linux/arm64) or built locally on the Spark.

name: aisamd-protocol-copilot

x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/python.Dockerfile
  image: aisamd-python:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  networks: [copilot]

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ── storage ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-copilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [copilot]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]  # loopback only; not reachable from the LAN
    volumes: [qdrant:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [copilot]

  # ── local inference (GB10 GPU) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama, vllm]
    restart: unless-stopped
    <<: *gpu
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]  # loopback only
    volumes: [ollama:/root/.ollama]
    networks: [copilot]

  ollama-pull:
    image: curlimages/curl:8.10.1
    profiles: [ollama, vllm]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes: ["./docker/ollama-pull.sh:/pull.sh:ro"]
    entrypoint: ["sh", "/pull.sh", "${LLM_MODEL:-qwen3:32b}", "${EMBEDDINGS_MODEL:-bge-m3}"]
    networks: [copilot]

  vllm:
    # NVIDIA's DGX Spark vLLM container (see docs/GB10_DEPLOYMENT.md for recipe-pinned tags/digests).
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.10.pre1-py3}
    profiles: [vllm]
    restart: unless-stopped
    <<: *gpu
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes: [hf-cache:/root/.cache/huggingface]
    ports: ["127.0.0.1:${VLLM_PORT:-8001}:8000"]  # loopback only
    command: >
      vllm serve ${VLLM_MODEL:-nvidia/Qwen3.8-27B-NVFP4}
      --host 0.0.0.0 --port 8000
      --served-model-name ${LLM_MODEL:-local-llm}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${VLLM_GPU_MEM:-0.60}
      --enable-prefix-caching --enable-chunked-prefill
      ${VLLM_EXTRA_ARGS:-}
    networks: [copilot]

  # ── MCP servers ────────────────────────────────────────────────────────────
  mcp-biostat-calc:
    <<: *python-service
    command: ["python", "-m", "mcp_biostat_calc", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8101"]
    expose: ["8101"]

  mcp-clinicaltrials:
    <<: *python-service
    command: ["python", "-m", "mcp_clinicaltrials", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8102"]
    expose: ["8102"]

  mcp-openfda-predicate:
    <<: *python-service
    command: ["python", "-m", "mcp_openfda_predicate", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8103"]
    expose: ["8103"]

  mcp-pubmed-evidence:
    <<: *python-service
    command: ["python", "-m", "mcp_pubmed_evidence", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8104"]
    expose: ["8104"]

  mcp-regulatory-rag:
    <<: *python-service
    command: ["python", "-m", "mcp_regulatory_rag", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8105"]
    expose: ["8105"]
    depends_on:
      qdrant: { condition: service_healthy }
    volumes: [corpus:/data]

  rag-ingest:
    <<: *python-service
    profiles: [ingest]
    restart: "no"
    working_dir: /app/mcp-servers/mcp-regulatory-rag
    command: ["python", "-m", "mcp_regulatory_rag.ingest", "--sources", "sources.yaml", "--include-checklists", "--data-dir", "/data/corpus"]
    depends_on:
      qdrant: { condition: service_healthy }
    volumes: [corpus:/data]

  # ── application ────────────────────────────────────────────────────────────
  backend:
    <<: *python-service
    command: ["uvicorn", "app.main:build", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    # Browsers reach the API through the frontend's server-side proxy, so the backend only needs
    # loopback for local curl / smoke tests. Set BACKEND_BIND=0.0.0.0 only if you must expose it.
    ports: ["${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      mcp-biostat-calc: { condition: service_started }
      mcp-clinicaltrials: { condition: service_started }
      mcp-openfda-predicate: { condition: service_started }
      mcp-pubmed-evidence: { condition: service_started }
      mcp-regulatory-rag: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        # Leave empty (default): the browser talks to same-origin /backend, which the Next.js
        # server proxies to the backend and signs with the API key. Set only for a split deployment.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    image: aisamd-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_API_KEY: ${API_KEY:-}
    ports: ["${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"]
    depends_on: [backend]
    networks: [copilot]

volumes:
  pgdata:
  qdrant:
  ollama:
  hf-cache:
  corpus:

networks:
  copilot:
