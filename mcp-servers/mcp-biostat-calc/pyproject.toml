[project]
name = "mcp-biostat-calc"
version = "0.1.0"
description = "Deterministic biostatistics MCP server (sample size, CIs, MRMC power) for AI-SaMD clinical studies"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.3,<3",
    "scipy>=1.14",
    "numpy>=2.0",
    "pydantic>=2.9",
]

[project.scripts]
mcp-biostat-calc = "mcp_biostat_calc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_biostat_calc"]
