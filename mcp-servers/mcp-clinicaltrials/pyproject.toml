[project]
name = "mcp-clinicaltrials"
version = "0.1.0"
description = "MCP server wrapping the ClinicalTrials.gov API v2 for AI-SaMD protocol benchmarking"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
mcp-clinicaltrials = "mcp_clinicaltrials.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_clinicaltrials"]
