[project]
name = "mcp-regulatory-rag"
version = "0.1.0"
description = "Regulatory guidance retrieval (Qdrant hybrid search) and AI-trial reporting checklists for AI-SaMD protocols"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=2.3,<3",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jieba>=0.42",
    "pypdf>=5",
]

[project.scripts]
mcp-regulatory-rag = "mcp_regulatory_rag.__main__:main"
mcp-regulatory-rag-ingest = "mcp_regulatory_rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_regulatory_rag"]
