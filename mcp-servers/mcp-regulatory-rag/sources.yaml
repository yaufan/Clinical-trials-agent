# Guidance corpus for the regulatory RAG index.
# `python -m mcp_regulatory_rag.ingest --sources sources.yaml` downloads each `url` (or reads `path`),
# extracts text, chunks it and indexes it into Qdrant. PDFs are cached under data/corpus/ and are
# NOT committed to git (see .gitignore). Add your own documents (e.g. SPIRIT-AI checklist PDF,
# ISO 14155 if licensed, C-IRB protocol templates) as additional entries with `path:`.
